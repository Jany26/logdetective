services:
  proxy:
    container_name: logdetective_proxy
    extends:
      file: docker-compose.yaml
      service: proxy
  inference-0:
    container_name: logdetective_inference
    extends:
      file: docker-compose.yaml
      service: inference-0
    # these lines are needed for CUDA acceleration
    # devices:
    #   - nvidia.com/gpu=all
  server:
    container_name: logdetective_server
    extends:
      file: docker-compose.yaml
      service: server
    image: logdetective/server
  migrate:
    extends:
      file: docker-compose.yaml
      service: migrate
    image: logdetective/migrate
  worker:
    extends:
      file: docker-compose.yaml
      service: worker
    image: logdetective/server
  maintenance-worker:
    extends:
      file: docker-compose.yaml
      service: maintenance-worker
    image: logdetective/server
  postgres:
    container_name: logdetective_postgres
    extends:
      file: docker-compose.yaml
      service: postgres
  user-contributions-update:
    container_name: logdetective_user_contributions_update
    extends:
      file: docker-compose.yaml
      service: user-contributions-update
    profiles:
      - sync

volumes:
  database_data:
    driver: local
